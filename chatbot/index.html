<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <link rel="stylesheet" href="/chatbot/styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

    <button id="chatbot-toggle" class="chatbot-toggle">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
    </button>


    <div id="chatbot-container" class="chatbot-container hidden">
        <div class="bg-[#0A0A0A] rounded-3xl shadow-2xl flex flex-col w-full h-full overflow-hidden">
            <div class="header-gradient text-white p-4 rounded-t-3xl text-center flex justify-between items-center">
                <h1 class="text-xl font-semibold">Social Media Marketing Assistant</h1>
                <button id="close-chatbot" class="text-white hover:text-gray-300">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div id="chat-container" class="chat-container p-4 flex-grow"></div>
            <div class="input-container p-4 rounded-b-3xl">
                <textarea id="message-input" class="input-field" placeholder="Type your message..." rows="1"></textarea>
                <button id="send-button" class="send-button">Send</button>
            </div>
        </div>
    </div>
    <script src="/chatbot/script.js" defer></script>

</body>
</html>
